<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalRecorder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #111113;
  --surface: #1c1c1f;
  --surface2: #27272b;
  --border: #2e2e33;
  --text: #e8e8ea;
  --text2: #8f8f96;
  --text3: #55555c;
  --accent: #3b82f6;
  --accent-dim: #1d3557;
  --red: #ef4444;
  --red-dim: #3b0f0f;
  --green: #22c55e;
  --yellow: #eab308;
  --orange: #f97316;
  --radius: 6px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'Cascadia Code', 'Consolas', monospace;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.5; }

/* ---- Layout ---- */
#app { display: flex; height: 100vh; overflow: hidden; }

#sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- Header ---- */
#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 8px 16px 10px;
  gap: 6px;
  flex-shrink: 0;
}
.header-top {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 26px;
}
#header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: var(--text); margin: 0; }
#version-badge { margin-left: auto; flex-shrink: 0; }
.header-badges {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
  width: 100%;
}
.chip-truncate {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* GPU badge: avoid single-line ellipsis hiding the model; allow wrap in 280px sidebar */
#gpu-badge {
  max-width: 100%;
  min-width: 0;
  white-space: normal;
  line-height: 1.35;
  word-break: break-word;
  overflow-wrap: anywhere;
  overflow: visible;
  text-overflow: clip;
}
#status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); transition: background 0.3s; }
#status-dot.idle    { background: var(--text3); }
#status-dot.active  { background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
#status-dot.stopping { background: var(--yellow); }
@keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
#session-label { font-size: 11px; color: var(--text2); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }

/* ---- Sidebar sections ---- */
.sidebar-section {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.sidebar-section:last-child { border-bottom: none; }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }

/* ---- Mode pills ---- */
#mode-row { display: flex; gap: 4px; }
.mode-pill {
  flex: 1;
  padding: 5px 0;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  color: var(--text2);
  background: transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.mode-pill:hover { color: var(--text); border-color: #454549; }
.mode-pill.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

/* ---- Form controls ---- */
.field { margin-bottom: 8px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.field select, .field input[type="text"], .field input[type="number"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
  padding: 5px 8px;
  outline: none;
  appearance: none;
}
.field select:focus, .field input:focus { border-color: var(--accent); }
.field select option { background: var(--surface2); }

.toggle-row { display: flex; align-items: center; justify-content: space-between; }
.toggle-row span { font-size: 12px; color: var(--text2); }
.toggle {
  position: relative; width: 30px; height: 17px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute; inset: 0; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 999px;
  transition: background 0.2s, border-color 0.2s;
}
.toggle input:checked ~ .toggle-track { background: var(--accent-dim); border-color: var(--accent); }
.toggle-thumb {
  position: absolute; top: 2px; left: 2px; width: 11px; height: 11px;
  background: var(--text3); border-radius: 50%; transition: left 0.2s, background 0.2s;
}
.toggle input:checked ~ .toggle-thumb { left: 15px; background: var(--accent); }

/* Diary / speaker-label slider (binary off–on) */
.diary-slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
}
.diary-slider-row span {
  font-size: 11px;
  color: var(--text3);
  flex-shrink: 0;
  min-width: 22px;
}
.diary-slider-row span.diary-val {
  min-width: 26px;
  text-align: center;
  color: var(--text2);
  font-family: var(--mono);
}
#diary-slider {
  flex: 1;
  min-width: 0;
  height: 6px;
  border-radius: 999px;
  background: var(--surface2);
  accent-color: var(--accent);
  cursor: pointer;
}
#diary-slider:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* ---- Record button ---- */
#record-btn {
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  transition: background 0.15s, opacity 0.15s;
}
#record-btn:hover { opacity: 0.88; }
#record-btn.recording { background: var(--red); }
#record-btn.stopping  { background: var(--surface2); color: var(--text2); cursor: default; }

/* ---- Peak meter ---- */
#peak-section { flex-shrink: 0; }
#meter-wrap { height: 14px; background: var(--surface2); border-radius: 3px; overflow: hidden; position: relative; }
#meter-bar { height: 100%; width: 0%; background: var(--green); border-radius: 3px; transition: width 0.05s linear; }
#meter-labels { display: flex; justify-content: space-between; margin-top: 3px; }
#meter-db { font-size: 11px; font-family: var(--mono); color: var(--text2); }
#meter-peak-hold { font-size: 11px; font-family: var(--mono); color: var(--text3); }

/* ---- Stats strip ---- */
#stats-row { display: flex; gap: 0; }
.stat-cell { flex: 1; }
.stat-cell + .stat-cell { border-left: 1px solid var(--border); padding-left: 10px; }
.stat-value { font-size: 18px; font-weight: 600; font-family: var(--mono); color: var(--text); line-height: 1.2; }
.stat-label { font-size: 10px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; }
#stat-elapsed .stat-value { font-size: 16px; }

/* ---- Queue badge ---- */
#queue-badge { display: none; margin-top: 6px; padding: 4px 8px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: var(--radius); font-size: 11px; color: var(--accent); }
#queue-badge.visible { display: block; }

/* ---- Main area ---- */
#tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 0 16px;
  gap: 0;
  flex-shrink: 0;
}
.tab-btn {
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  font-family: var(--font);
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

#tab-content { flex: 1; overflow: hidden; position: relative; }
.tab-pane { position: absolute; inset: 0; overflow-y: auto; padding: 16px; display: none; }
.tab-pane.active { display: block; }
#tab-live { padding: 8px 10px; }

/* ---- Transcript feed ---- */
#transcript-feed { display: flex; flex-direction: column; gap: 2px; }

.chunk-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
}
.chunk-card.status-pending  { border-left: 2px solid var(--text3); }
.chunk-card.status-ok       { border-left: 2px solid var(--green); }
.chunk-card.status-failed   { border-left: 2px solid var(--red); }
.chunk-card.status-skipped  { border-left: 2px solid var(--text3); opacity: 0.6; }

.chunk-text { font-size: 12px; color: var(--text); line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.chunk-text.empty { color: var(--text3); font-style: italic; font-size: 11px; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; color: var(--text3); }
.empty-state p { font-size: 13px; }

/* ---- Session browser ---- */
#sessions-list { display: flex; flex-direction: column; gap: 6px; }

.session-group { }
.session-date { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.06em; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.session-items { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }

.session-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.15s;
}
.session-item:hover { border-color: #454549; }
.session-item.active { border-color: var(--accent); background: var(--accent-dim); }
.session-item-name { flex: 1; font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-item-count { font-size: 11px; color: var(--text3); font-family: var(--mono); }

.session-detail { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.detail-chunk {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.detail-chunk-left { flex: 1; min-width: 0; }
.detail-chunk-name { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-bottom: 2px; }
.detail-chunk-text { font-size: 12px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
.detail-chunk-text.none { color: var(--text3); font-style: italic; }
.detail-chunk-peak { font-size: 11px; color: var(--text3); font-family: var(--mono); white-space: nowrap; }

/* ---- Scrollbar ---- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #454549; }
</style>
</head>
<body>
<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">

    <div id="header">
      <div class="header-top">
        <span id="status-dot" class="idle"></span>
        <h1>LocalRecorder</h1>
        <span id="version-badge" style="font-size:10px;font-family:var(--mono);color:var(--text3);"></span>
      </div>
      <div class="header-badges">
        <span id="model-chip" class="chip-truncate" title="" style="font-size:10px;font-family:var(--mono);color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:2px 6px;white-space:nowrap;display:none;"></span>
        <!-- GPU-3: second row so long GPU names don't crowd the model chip (narrow sidebar). -->
        <span id="gpu-badge" title="" style="font-size:10px;font-family:var(--mono);color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:2px 6px;display:none;"></span>
      </div>
    </div>

    <!-- Mode -->
    <div class="sidebar-section">
      <div class="section-label">Mode</div>
      <div id="mode-row">
        <button class="mode-pill active" data-mode="chunk">Chunk</button>
        <button class="mode-pill" data-mode="record">Record</button>
        <button class="mode-pill" data-mode="listen">Listen</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="sidebar-section">
      <div class="section-label">Settings</div>
      <div class="field">
        <label>Output directory</label>
        <div style="display:flex;gap:4px;align-items:center;">
          <input type="text" id="root-input" placeholder="default (./recordings)" style="flex:1;min-width:0;">
          <button id="root-reset-btn" title="Reset to default" style="flex-shrink:0;padding:4px 7px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);cursor:pointer;font-size:11px;">↺</button>
        </div>
        <div id="root-hint" style="font-size:10px;color:var(--text3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
      </div>
      <div class="field">
        <label>Input device</label>
        <select id="device-select"><option value="">Default</option></select>
      </div>
      <div class="field">
        <label>Session name</label>
        <input type="text" id="name-input" placeholder="optional label…">
      </div>
      <div class="field" id="chunk-fields">
        <label>Max chunk (seconds)</label>
        <input type="number" id="max-chunk-input" value="30" min="5" max="3600">
      </div>
      <div class="field toggle-row" id="transcribe-field">
        <span>Transcribe</span>
        <label class="toggle">
          <input type="checkbox" id="transcribe-toggle" checked>
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>
      <div class="field" id="diary-field">
        <label for="diary-slider">Diary</label>
        <div class="diary-slider-row">
          <span>Off</span>
          <input type="range" id="diary-slider" min="0" max="1" step="1" value="1" aria-valuetext="on">
          <span>On</span>
          <span class="diary-val" id="diary-slider-val">On</span>
        </div>
      </div>
    </div>

    <!-- Record button -->
    <div class="sidebar-section">
      <button id="record-btn">Start Recording</button>
    </div>

    <!-- Peak meter -->
    <div class="sidebar-section" id="peak-section">
      <div class="section-label">Level</div>
      <div id="meter-wrap"><div id="meter-bar"></div></div>
      <div id="meter-labels">
        <span id="meter-db">— dBFS</span>
        <span id="meter-peak-hold"></span>
      </div>
    </div>

    <!-- Stats -->
    <div class="sidebar-section">
      <div id="stats-row">
        <div class="stat-cell" id="stat-elapsed">
          <div class="stat-value" id="elapsed-value">--:--</div>
          <div class="stat-label">Elapsed</div>
        </div>
        <div class="stat-cell" style="padding-left:14px;">
          <div class="stat-value" id="chunks-value">0</div>
          <div class="stat-label">Chunks</div>
        </div>
      </div>
      <div id="queue-badge">0 transcribing</div>
    </div>

    <div style="flex:1;"></div>

  </aside>

  <!-- MAIN -->
  <main id="main">

    <div id="tab-bar">
      <button class="tab-btn active" data-tab="live">Live Transcript</button>
      <button class="tab-btn" data-tab="sessions">Sessions</button>
    </div>

    <div id="tab-content">

      <!-- Live transcript tab -->
      <div class="tab-pane active" id="tab-live">
        <div id="transcript-feed">
          <div class="empty-state" id="live-empty">
            <p>Start recording to see transcripts here.</p>
          </div>
        </div>
      </div>

      <!-- Sessions browser tab -->
      <div class="tab-pane" id="tab-sessions">
        <div id="sessions-list">
          <div class="empty-state" id="sessions-empty"><p>Loading sessions…</p></div>
        </div>
      </div>

    </div>
  </main>

</div>

<script>
// ---- WebSocket --------------------------------------------------------

const ws = new WebSocket(`ws://${location.host}`);

ws.addEventListener('message', (e) => {
  let msg;
  try { msg = JSON.parse(e.data); } catch { return; }
  handleMessage(msg);
});

ws.addEventListener('close', () => {
  setStatusDot('idle');
});

// ---- State ------------------------------------------------------------

let appMode = 'chunk';  // current UI mode selection
let isRecording = false;
let isStopping = false;
let elapsedMs = 0;
let elapsedInterval = null;
let chunkCount = 0;
let queueDepth = 0;

// Peak meter state (see onPeakData + animateMeter)
let levelSmooth = 0; // asymmetric EMA of linear peak — drives bar + main dB readout
let peakHold = 0;
let peakHoldTimer = null;

// ---- DOM refs ---------------------------------------------------------

const statusDot     = document.getElementById('status-dot');
const recordBtn     = document.getElementById('record-btn');
const deviceSelect  = document.getElementById('device-select');
const nameInput     = document.getElementById('name-input');
const maxChunkInput = document.getElementById('max-chunk-input');
const transcribeTog = document.getElementById('transcribe-toggle');
const diarySlider = document.getElementById('diary-slider');
const diarySliderVal = document.getElementById('diary-slider-val');
const chunkFields   = document.getElementById('chunk-fields');
const transcribeField = document.getElementById('transcribe-field');
const diaryField = document.getElementById('diary-field');
const DIARY_STORAGE_KEY = 'lr-ui-diary-on';
const modePills     = document.querySelectorAll('.mode-pill');
const meterBar      = document.getElementById('meter-bar');
const meterDbEl     = document.getElementById('meter-db');
const meterPeakEl   = document.getElementById('meter-peak-hold');
const elapsedEl     = document.getElementById('elapsed-value');
const chunksEl      = document.getElementById('chunks-value');
const queueBadge    = document.getElementById('queue-badge');
const sessionLabel  = document.getElementById('session-label');
const transcriptFeed = document.getElementById('transcript-feed');
const liveEmpty     = document.getElementById('live-empty');
const sessionsList  = document.getElementById('sessions-list');
const sessionsEmpty = document.getElementById('sessions-empty');

// ---- Tabs -------------------------------------------------------------

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach((p) => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'sessions') loadSessions();
  });
});

// ---- Mode pills -------------------------------------------------------

modePills.forEach((pill) => {
  pill.addEventListener('click', () => {
    if (isRecording) return;
    appMode = pill.dataset.mode;
    modePills.forEach((p) => p.classList.toggle('active', p.dataset.mode === appMode));
    updateModeUI();
  });
});

function diarySliderOn() {
  return diarySlider.value === '1';
}

function syncDiarySliderUi() {
  const on = diarySliderOn();
  diarySliderVal.textContent = on ? 'On' : 'Off';
  diarySlider.setAttribute('aria-valuetext', on ? 'on' : 'off');
}

function syncDiaryEnabledState() {
  const transcribeRelevant = appMode !== 'listen' && transcribeTog.checked;
  diarySlider.disabled = !transcribeRelevant;
}

function updateModeUI() {
  chunkFields.style.display = appMode === 'chunk' ? '' : 'none';
  transcribeField.style.display = appMode === 'listen' ? 'none' : '';
  diaryField.style.display = appMode === 'listen' ? 'none' : '';
  syncDiaryEnabledState();
}
updateModeUI();

(function initDiarySliderFromStorage() {
  const saved = localStorage.getItem(DIARY_STORAGE_KEY);
  diarySlider.value = saved === '0' ? '0' : '1';
  syncDiarySliderUi();
})();

diarySlider.addEventListener('input', () => {
  localStorage.setItem(DIARY_STORAGE_KEY, diarySlider.value === '1' ? '1' : '0');
  syncDiarySliderUi();
});

transcribeTog.addEventListener('change', () => {
  syncDiaryEnabledState();
});

// ---- Record button ----------------------------------------------------

recordBtn.addEventListener('click', async () => {
  if (isStopping) return;
  if (isRecording) {
    await doStop();
  } else {
    await doStart();
  }
});

async function doStart() {
  const body = {
    mode: appMode,
    device: deviceSelect.value || undefined,
    name: nameInput.value.trim() || undefined,
    root: rootInput.value.trim() || undefined,
    transcribe: appMode !== 'listen' ? transcribeTog.checked : false,
    transcribeSpeakerLabels:
      appMode !== 'listen' && transcribeTog.checked ? diarySliderOn() : false,
    maxChunkSeconds: appMode === 'chunk' ? (parseInt(maxChunkInput.value, 10) || 30) : undefined,
  };

  recordBtn.disabled = true;
  try {
    const r = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) { alert('Start failed: ' + (data.error || r.status)); return; }
  } catch (err) {
    alert('Start failed: ' + err.message);
  } finally {
    recordBtn.disabled = false;
  }
}

async function doStop() {
  recordBtn.disabled = true;
  isStopping = true;
  recordBtn.textContent = 'Stopping…';
  recordBtn.className = 'stopping';
  try {
    await fetch('/api/stop', { method: 'POST' });
  } catch { /* ignore */ } finally {
    recordBtn.disabled = false;
  }
}

// ---- WebSocket message handler ----------------------------------------

function handleMessage(msg) {
  switch (msg.type) {

    case 'sync':
      // Full state snapshot sent on every new WebSocket connection.
      // Reconstruct the transcript feed in chronological start order so
      // a hard-refresh mid-session doesn't show chunks out of order.
      if (msg.mode && !isRecording) {
        setRecordingState(true, msg.mode);
        if (msg.sessionDir) sessionLabel.textContent = msg.sessionDir;
      }
      if (msg.elapsed != null) updateElapsed(msg.elapsed);
      if (msg.chunkCount != null) updateChunkCount(msg.chunkCount);
      if (msg.queueDepth != null) updateQueue(msg.queueDepth);
      if (msg.chunks && msg.chunks.length > 0) {
        clearTranscriptFeed();
        for (const c of msg.chunks) {
          addChunkCard({ name: c.name, wavPath: c.wavPath, status: c.status || 'pending' });
          if (c.status && c.status !== 'pending') {
            updateChunkCard({ name: c.name, wavPath: c.wavPath, status: c.status, transcript: c.transcript, error: c.error });
          }
        }
        scrollToBottom();
      }
      break;

    case 'status':
      if (msg.mode && !isRecording) {
        setRecordingState(true, msg.mode);
      } else if (!msg.mode && isRecording) {
        setRecordingState(false);
      }
      if (msg.elapsed != null) updateElapsed(msg.elapsed);
      if (msg.chunkCount != null) updateChunkCount(msg.chunkCount);
      if (msg.queueDepth != null) updateQueue(msg.queueDepth);
      break;

    case 'started':
      setRecordingState(true, msg.mode);
      clearTranscriptFeed();
      if (msg.sessionDir) {
        sessionLabel.textContent = msg.sessionDir;
      }
      break;

    case 'peak':
      onPeakData(msg.value);
      break;

    case 'chunk_started':
      updateChunkCount(msg.chunkCount);
      if (msg.wavPath) { addChunkCard({ name: msg.name, wavPath: msg.wavPath, status: 'pending' }); scrollToBottom(); }
      break;

    case 'chunk_complete':
      updateChunkCard(msg);
      if (msg.queueDepth != null) updateQueue(msg.queueDepth);
      break;

    case 'queue_overflow':
      updateQueue(msg.depth);
      break;

    case 'stopping':
      isStopping = true;
      recordBtn.textContent = 'Stopping…';
      recordBtn.className = 'stopping';
      setStatusDot('stopping');
      break;

    case 'stopped':
      setRecordingState(false);
      break;

    case 'server_info':
      applyServerInfo(msg);
      break;
  }
}

// ---- Recording state --------------------------------------------------

function setRecordingState(active, mode) {
  isRecording = active;
  isStopping = false;

  if (active) {
    recordBtn.textContent = 'Stop';
    recordBtn.className = 'recording';
    recordBtn.disabled = false;
    setStatusDot('active');
    modePills.forEach((p) => p.style.pointerEvents = 'none');
    startElapsedTimer();
  } else {
    recordBtn.textContent = 'Start Recording';
    recordBtn.className = '';
    recordBtn.disabled = false;
    setStatusDot('idle');
    modePills.forEach((p) => p.style.pointerEvents = '');
    stopElapsedTimer();
    elapsedEl.textContent = '--:--';
    chunksEl.textContent = '0';
    updateQueue(0);
    sessionLabel.textContent = '';
    levelSmooth = 0;
    peakHold = 0;
    clearTimeout(peakHoldTimer);
    peakHoldTimer = null;
  }
}

function setStatusDot(state) {
  statusDot.className = state;
}

// ---- Elapsed timer ----------------------------------------------------

function startElapsedTimer() {
  const base = Date.now() - elapsedMs;
  elapsedInterval = setInterval(() => {
    elapsedMs = Date.now() - base;
    renderElapsed(elapsedMs);
  }, 500);
}

function stopElapsedTimer() {
  clearInterval(elapsedInterval);
  elapsedMs = 0;
}

function updateElapsed(ms) {
  elapsedMs = ms;
  renderElapsed(ms);
  if (isRecording && !elapsedInterval) startElapsedTimer();
}

function renderElapsed(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  const ss = String(s % 60).padStart(2, '0');
  const mm = String(m % 60).padStart(2, '0');
  elapsedEl.textContent = h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

// ---- Chunk / queue counts ---------------------------------------------

function updateChunkCount(n) {
  chunkCount = n;
  chunksEl.textContent = n;
}

function updateQueue(depth) {
  queueDepth = depth;
  if (depth > 0) {
    queueBadge.textContent = `${depth} transcribing…`;
    queueBadge.classList.add('visible');
  } else {
    queueBadge.classList.remove('visible');
  }
}

// ---- Peak meter -------------------------------------------------------
//
// Linear amplitude 0..1 maps to dBFS as 20*log10(x). Typical speech peaks land
// around -15..-40 dBFS (linear 0.03..0.18) — only ~3-18% of a raw linear bar,
// so the meter looks "dead". Map a dB window to the bar width instead.

const METER_BAR_DB_MIN = -60; // noise floor (silence clamp)

function linearAmplitudeToBarPercent(lin) {
  if (!(lin > 0)) return 0;
  const db = 20 * Math.log10(Math.max(1e-10, lin));
  if (db <= METER_BAR_DB_MIN) return 0;
  if (db >= 0) return 100;
  return ((db - METER_BAR_DB_MIN) / (0 - METER_BAR_DB_MIN)) * 100;
}

function onPeakData(value) {
  const v = Number.isFinite(value) && value > 0 ? value : 0;
  // Asymmetric smoothing (~12 Hz server peaks): fast attack tracks speech hits;
  // release faster than 0.055 so the bar doesn't "stick" after pauses, but still
  // slower than attack to filter noise flutter on the dB readout.
  const ATTACK = 0.34;
  const RELEASE = 0.11;
  const k = v >= levelSmooth ? ATTACK : RELEASE;
  levelSmooth = levelSmooth * (1 - k) + v * k;

  if (v > peakHold) {
    peakHold = v;
    clearTimeout(peakHoldTimer);
    peakHoldTimer = setTimeout(() => { peakHold = 0; }, 2000);
  }
}

(function animateMeter() {
  const pct = linearAmplitudeToBarPercent(levelSmooth);
  meterBar.style.width = pct + '%';

  // Color: green (low) → yellow (mid) → red (hot)
  const hue = Math.max(0, 120 - pct * 1.5);
  const sat = 80 + pct * 0.2;
  const lit = pct > 80 ? 42 : 45;
  meterBar.style.background = `hsl(${hue}, ${sat}%, ${lit}%)`;

  const db = levelSmooth > 1e-7 ? 20 * Math.log10(Math.max(1e-10, levelSmooth)) : null;
  meterDbEl.textContent = db != null ? db.toFixed(1) + ' dBFS' : '— dBFS';

  if (peakHold > 0) {
    const phDb = 20 * Math.log10(Math.max(0.00001, peakHold));
    meterPeakEl.textContent = 'pk ' + phDb.toFixed(1);
  } else {
    meterPeakEl.textContent = '';
  }

  requestAnimationFrame(animateMeter);
})();

// ---- Transcript feed --------------------------------------------------

const chunkCards = new Map(); // wavPath → element

function scrollToBottom() {
  const pane = document.getElementById('tab-live');
  pane.scrollTop = pane.scrollHeight;
}

function clearTranscriptFeed() {
  transcriptFeed.innerHTML = '';
  transcriptFeed.appendChild(liveEmpty);
  liveEmpty.style.display = '';
  chunkCards.clear();
}

function addChunkCard({ name, wavPath, status, transcript }) {
  liveEmpty.style.display = 'none';

  const card = document.createElement('div');
  card.className = `chunk-card status-${status || 'pending'}`;
  card.dataset.wav = wavPath;
  card.title = name ? `${name} (${status || 'pending'})` : String(status || 'pending');
  card.innerHTML = '<div class="chunk-text empty">transcribing…</div>';
  transcriptFeed.appendChild(card);
  chunkCards.set(wavPath, card);
}

function updateChunkCard({ name, wavPath, status, transcript, error }) {
  let card = wavPath ? chunkCards.get(wavPath) : null;
  if (!card) {
    // Chunk completed without a prior started event (e.g. record mode).
    addChunkCard({ name, wavPath, status });
    card = chunkCards.get(wavPath);
  }
  card.className = `chunk-card status-${status}`;
  card.title = name ? `${name} (${status})` : String(status);

  const textEl = card.querySelector('.chunk-text');
  if (status === 'ok') {
    if (transcript && transcript.trim()) {
      textEl.textContent = transcript;
      textEl.className = 'chunk-text';
    } else {
      textEl.textContent = '(no speech)';
      textEl.className = 'chunk-text empty';
    }
  } else if (status === 'failed') {
    textEl.textContent = error || 'Transcription failed.';
    textEl.className = 'chunk-text empty';
  } else if (status === 'skipped') {
    textEl.textContent = 'Skipped (low audio level).';
    textEl.className = 'chunk-text empty';
  }
}

// ---- Session browser --------------------------------------------------

let sessionData = [];
let activeSession = null;

async function loadSessions() {
  sessionsEmpty.textContent = 'Loading…';
  sessionsEmpty.style.display = '';
  sessionsList.innerHTML = '';
  sessionsList.appendChild(sessionsEmpty);
  try {
    const r = await fetch('/api/sessions');
    sessionData = await r.json();
  } catch (err) {
    sessionsEmpty.textContent = 'Failed to load sessions.';
    return;
  }

  if (!sessionData.length) {
    sessionsEmpty.textContent = 'No sessions found in the recordings folder.';
    return;
  }
  sessionsEmpty.style.display = 'none';

  // Group by date
  const byDate = {};
  for (const s of sessionData) {
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  }

  sessionsList.innerHTML = '';
  for (const date of Object.keys(byDate).sort().reverse()) {
    const group = document.createElement('div');
    group.className = 'session-group';
    group.innerHTML = `<div class="session-date">${date}</div><div class="session-items" data-date="${date}"></div>`;
    const items = group.querySelector('.session-items');

    for (const s of byDate[date]) {
      const label = s.name || '(unnamed)';
      const item = document.createElement('div');
      item.className = 'session-item';
      item.innerHTML = `<span class="session-item-name">${escHtml(label)}</span>`;
      item.addEventListener('click', () => openSession(s, item));
      items.appendChild(item);
    }
    sessionsList.appendChild(group);
  }
}

async function openSession(session, itemEl) {
  document.querySelectorAll('.session-item').forEach((el) => el.classList.remove('active'));
  itemEl.classList.add('active');
  activeSession = session;

  // Remove any existing detail panel
  document.querySelectorAll('.session-detail').forEach((el) => el.remove());

  let detail;
  try {
    const url = `/api/sessions/${session.date}${session.name ? `?name=${encodeURIComponent(session.name)}` : ''}`;
    const r = await fetch(url);
    detail = await r.json();
  } catch (err) {
    return;
  }

  const panel = document.createElement('div');
  panel.className = 'session-detail';

  if (!detail.chunks.length) {
    panel.innerHTML = '<p style="color:var(--text3);font-size:12px;">No WAV files in this session.</p>';
  }

  for (const chunk of detail.chunks) {
    const db = chunk.sidecar && chunk.sidecar.peakDb != null
      ? chunk.sidecar.peakDb.toFixed(1) + ' dB'
      : '';
    const dur = chunk.sidecar && chunk.sidecar.durationMs != null
      ? formatDurMs(chunk.sidecar.durationMs)
      : '';

    const div = document.createElement('div');
    div.className = 'detail-chunk';
    div.innerHTML = `
      <div class="detail-chunk-left">
        <div class="detail-chunk-name">${escHtml(chunk.wav)}</div>
        <div class="detail-chunk-text ${chunk.transcript ? '' : 'none'}">
          ${chunk.transcript ? escHtml(chunk.transcript) : 'No transcript.'}
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        ${dur ? `<div class="detail-chunk-peak">${escHtml(dur)}</div>` : ''}
        ${db  ? `<div class="detail-chunk-peak">${escHtml(db)}</div>`  : ''}
      </div>
    `;
    panel.appendChild(div);
  }

  itemEl.insertAdjacentElement('afterend', panel);
}

// ---- Devices ----------------------------------------------------------

async function loadDevices() {
  try {
    const r = await fetch('/api/devices');
    if (!r.ok) return;
    const devices = await r.json();
    deviceSelect.innerHTML = '<option value="">Default</option>';
    for (const d of devices) {
      const opt = document.createElement('option');
      opt.value = d.index != null ? String(d.index) : d.name;
      opt.textContent = d.name + (d.isDefault ? ' (default)' : '');
      deviceSelect.appendChild(opt);
    }
  } catch { /* sox not available or not on Windows — just leave Default */ }
}

// ---- Helpers ----------------------------------------------------------

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDurMs(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const ss = String(s % 60).padStart(2, '0');
  return m > 0 ? `${m}:${ss}` : `0:${ss}`;
}

// ---- Output directory -------------------------------------------------

const rootInput    = document.getElementById('root-input');
const rootResetBtn = document.getElementById('root-reset-btn');
const rootHint     = document.getElementById('root-hint');
const versionBadge = document.getElementById('version-badge');
const gpuBadge     = document.getElementById('gpu-badge');

let defaultRecordingsRoot = '';

// GPU-3: render the small "GPU: <name>" / "GPU: off" badge in the sidebar.
// Strip common vendor prefixes so e.g. "RTX 4070 Ti" fits without a mid-token
// slice; word-aware cap (~48 chars) only if still long. title = full device + details.
function gpuBadgeDisplayName(deviceName) {
  const raw = String(deviceName || 'GPU').trim();
  if (!raw) return 'GPU';
  let s = raw;
  const prefixes = [
    /^NVIDIA\s+GeForce\s+/i,
    /^NVIDIA\s+/i,
    /^GeForce\s+/i,
    /^AMD\s+Radeon\s+/i,
    /^AMD\s+/i,
    /^Intel\s+\(R\)\s+Arc\s+\(TM\)\s+/i,
    /^Intel\s+Arc\s+/i,
    /^Intel\s+\(R\)\s+/i,
  ];
  for (const re of prefixes) s = s.replace(re, '');
  s = s.trim() || raw;
  const maxLen = 48;
  if (s.length <= maxLen) return s;
  const slice = s.slice(0, maxLen);
  const lastSpace = slice.lastIndexOf(' ');
  const cut = lastSpace > 24 ? slice.slice(0, lastSpace) : slice;
  return cut + '…';
}

function renderGpuBadge(gpu) {
  if (!gpu) { gpuBadge.style.display = 'none'; return; }
  if (gpu.available) {
    const name = gpuBadgeDisplayName(gpu.deviceName);
    gpuBadge.textContent = `GPU: ${name}`;
    gpuBadge.style.color = '#7fd181';  // green on dark
    gpuBadge.style.borderColor = '#3b6b3d';
    const vramStr = gpu.vramMb ? ` (${gpu.vramMb} MiB)` : '';
    const drvStr = gpu.driver ? `\ndriver: ${gpu.driver}` : '';
    gpuBadge.title = `${gpu.deviceName || ''}${vramStr}${drvStr}`.trim();
  } else {
    gpuBadge.textContent = 'GPU: off';
    gpuBadge.style.color = 'var(--text3)';
    gpuBadge.style.borderColor = 'var(--border)';
    gpuBadge.title = gpu.reason || 'GPU acceleration is not available';
  }
  gpuBadge.style.display = '';
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    defaultRecordingsRoot = cfg.recordingsRoot || '';
    rootHint.textContent = defaultRecordingsRoot;
    rootInput.placeholder = defaultRecordingsRoot || 'default (./recordings)';
    if (cfg.version) versionBadge.textContent = `v${cfg.version}`;
    renderGpuBadge(cfg.gpu);
  } catch { /* server not ready yet */ }
}

rootInput.addEventListener('input', () => {
  const val = rootInput.value.trim();
  rootHint.textContent = val || defaultRecordingsRoot;
});

rootResetBtn.addEventListener('click', () => {
  rootInput.value = '';
  rootHint.textContent = defaultRecordingsRoot;
});

// ---- Model chip -------------------------------------------------------

const modelChip = document.getElementById('model-chip');

function applyServerInfo(info) {
  if (!info || !info.modelName) return;
  modelChip.textContent = info.modelName;
  const binaryLabel = info.serverBinary
    ? `via ${info.serverBinary}`
    : info.binary
    ? `via ${info.binary}`
    : 'no binary found';
  modelChip.title = `${info.modelPath || info.modelName}  ·  ${binaryLabel}`;
  modelChip.style.display = '';
}

async function loadInfo() {
  try {
    const r = await fetch('/api/info');
    if (!r.ok) return;
    applyServerInfo(await r.json());
  } catch { /* server not ready yet */ }
}

// ---- Init -------------------------------------------------------------

loadDevices();
loadConfig();
loadInfo();
</script>
